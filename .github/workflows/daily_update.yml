name: Daily oil data, forecast and email

on:
  schedule:
    # Every day (day-of-week is `*`; note cron weekdays are read in UTC, so "1-5" skipped Monday morning SGT).
    # 22:45 UTC is 06:45 Singapore. The first step holds the run until 23:00 UTC = 07:00 Singapore.
    - cron: "45 22 * * *"
  workflow_dispatch:             # manual run from the Actions tab (all steps run by default)
    inputs:
      download_data:
        description: "Download the latest data first (untick to use the data already in the repo)"
        type: boolean
        default: true
      send_email:
        description: "Send the email report"
        type: boolean
        default: true
      email_to:
        description: "Send only to these addresses, comma-separated (empty = default team list)"
        type: string
        default: ""
      run_frozen_eval:
        description: "Re-run the frozen-model evaluation now (otherwise: 1st of the month or when missing)"
        type: boolean
        default: false
      backfill_days:
        description: "Also recompute forecasts for the last N trading days (0 = off)"
        type: string
        default: "0"

permissions:
  contents: write                # needed to commit the updated CSVs and forecast log

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 0. Hold until 07:00 Singapore time (scheduled runs only)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          # GitHub may start a scheduled run late, never early. If it started 21:00-22:59 UTC, wait for 23:00 UTC.
          h=$(date -u +%H)
          if [ "$h" = "21" ] || [ "$h" = "22" ]; then
            wait=$(( $(date -u -d "23:00" +%s) - $(date -u +%s) ))
            echo "Started at $(date -u +%H:%M) UTC; waiting ${wait}s until 23:00 UTC (07:00 SGT)"
            sleep "$wait"
          else
            echo "Started at $(date -u +%H:%M) UTC; no wait needed"
          fi

      - run: pip install -r requirements.txt

      - name: 1. Download the latest data and merge into the CSVs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.download_data }}
        run: python scripts/update_data.py

      - name: 2. Forecast with the saved models (no retraining)
        env:
          BACKFILL: ${{ inputs.backfill_days || '0' }}
        run: |
          if [ "$BACKFILL" != "0" ]; then
            python scripts/run_daily.py --backfill "$BACKFILL"
          else
            python scripts/run_daily.py
          fi

      - name: 2b. Frozen-model evaluation (1st of the month, when missing, or when ticked)
        env:
          FORCE: ${{ inputs.run_frozen_eval || 'false' }}
        run: |
          if [ "$FORCE" = "true" ] || [ "$(date -u +%d)" = "01" ] || [ ! -f Outputs/frozen_eval/summary.json ]; then
            python scripts/frozen_eval.py
          else
            echo "Frozen-model evaluation is up to date; skipping."
          fi

      - name: 3. Commit updated data and forecast log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/raw/*.csv Outputs/forecast_log.csv Outputs/latest_forecasts.csv Outputs/frozen_eval
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Daily update $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: 4. Email the report
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.send_email }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_SUBJECT_PREFIX: ${{ github.event_name == 'workflow_dispatch' && '(manual run) ' || '' }}
          EMAIL_TO: ${{ inputs.email_to }}
        run: python scripts/send_email.py        # recipients are set in forecast/mailer.py
