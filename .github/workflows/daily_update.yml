name: Daily oil data, forecast and email

on:
  schedule:
    - cron: "17 22 * * 1-5"     # 22:17 UTC Mon-Fri = 06:17 Singapore Tue-Sat, after the US close
  workflow_dispatch:             # manual run from the Actions tab (all steps run by default)
    inputs:
      download_data:
        description: "Download the latest data first (untick to use the data already in the repo)"
        type: boolean
        default: true
      send_email:
        description: "Send the email report"
        type: boolean
        default: true
      email_to:
        description: "Send only to these addresses, comma-separated (empty = default team list)"
        type: string
        default: ""
      backfill_days:
        description: "Also recompute forecasts for the last N trading days (0 = off)"
        type: string
        default: "0"

permissions:
  contents: write                # needed to commit the updated CSVs and forecast log

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 1. Download the latest data and merge into the CSVs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.download_data }}
        run: python scripts/update_data.py

      - name: 2. Forecast with the saved models (no retraining)
        env:
          BACKFILL: ${{ inputs.backfill_days || '0' }}
        run: |
          if [ "$BACKFILL" != "0" ]; then
            python scripts/run_daily.py --backfill "$BACKFILL"
          else
            python scripts/run_daily.py
          fi

      - name: 3. Commit updated data and forecast log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/raw/*.csv Outputs/forecast_log.csv Outputs/latest_forecasts.csv
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Daily update $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: 4. Email the report
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.send_email }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_SUBJECT_PREFIX: ${{ github.event_name == 'workflow_dispatch' && '(manual run) ' || '' }}
          EMAIL_TO: ${{ inputs.email_to }}
        run: python scripts/send_email.py        # recipients are set in forecast/mailer.py
