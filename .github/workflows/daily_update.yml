name: Daily oil data update

on:
  schedule:
    - cron: "0 23 * * 1-5"      # 23:00 UTC Mon-Fri = 07:00 Singapore Tue-Sat, after the US close
  workflow_dispatch:             # also lets you run it manually from the Actions tab

permissions:
  contents: write                # needed to commit the updated CSVs

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download last 90 days of every series and merge into the CSVs
        run: python scripts/update_data.py

      - name: Commit updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/raw/*.csv
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily data update $(date -u +%F)"
            git push
          fi

      - name: Email the last-10-days summary
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: e0725196@u.nus.edu
          EMAIL_CC: yja210199@gmail.com
        run: python scripts/send_email.py
